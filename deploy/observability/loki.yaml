# Loki: log storage and query (LogQL). Receives logs from the OTel Collector
# over OTLP/HTTP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: observability
  labels:
    app: loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      securityContext:
        fsGroup: 10001 # the image's "loki" user
      containers:
        - name: loki
          image: grafana/loki:3.5.3
          args:
            - -config.file=/etc/loki/loki.yaml
          env:
            # Tell the Go runtime where the ceiling is, so it collects garbage
            # harder as it nears the 256Mi limit instead of being OOM-killed.
            # Measured over two hours: resident memory peaked at 166 MiB, so
            # this is a safety net, not a brake.
            - name: GOMEMLIMIT
              value: 200MiB
          ports:
            - name: http
              containerPort: 3100
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: observability
spec:
  type: NodePort # localhost:3100 via the k3d port mapping
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
      nodePort: 30100
