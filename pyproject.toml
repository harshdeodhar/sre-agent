[project]
name = "oncall"
version = "0.1.0"
description = "AI on-call (SRE) agent with an incident benchmark"
requires-python = ">=3.13"
dependencies = [
    # Typed models for everything parsed from YAML or JSON.
    "pydantic>=2.9,<3",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    # Test-only: validates incidents/*.yaml against the checked-in JSON schema,
    # independently of the pydantic models the schema was generated from.
    "jsonschema>=4.23,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oncall"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, B: bugbear (likely bugs),
# UP: outdated syntax, SIM: needless complexity, ANN: missing type hints.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ANN"]
# Line length belongs to the formatter. What it cannot wrap is long string
# literals (PromQL queries, mostly), which read better unbroken.
ignore = ["E501"]
